spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET_KEY}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${BASE_URL}/login/oauth2/code/google"
  ai:
    openai:
      api-key: ${GPT_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-5.3-chat-latest}
          temperature: ${OPENAI_TEMPERATURE:1}

logging:
  level:
    root: ERROR

gladia:
  create-request:
    cron: "0 * * * * ?"
  get-response:
    cron: "0 */5 * * * ?"
  api:
    key: 1bbce0b4-c67d-4cfc-902d-2b6b5e69fcf8

llm:
  generate-lesson:
    cron: "0 * * * * ?"

lesson:
  ready-lesson:
    cron: "0 * * * * ?"

history:
  cleanup:
    cron: "0 0 2 * * *"
    retention-days: 30
app:
  frontend-url: ${FRONTEND_URL}
  jwt:
    expiration-seconds: 604800
    secret-base64: ${JWT_SECRET}

brevo:
  base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
  api-key: ${BREVO_API_KEY}
  list-id: ${BREVO_LIST_ID:3}



server:
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

paddle:
  api:
    key: ${PADDLE_API_KEY}
    url: ${PADDLE_API_URL:https://sandbox-api.paddle.com}
  webhook:
    secret: ${WEBHOOK_TOKEN}
  price:
    start: ${PRICE_START}
    plus: ${PRICE_PLUS}
    open-library: ${PRICE_OPEN_LIB}
    100-mins-start: ${100_MIN_START}
    100-mins-plus: ${100_MIN_PLUS}
  subscription-expiration:
    cron: 0 0 * * * *
